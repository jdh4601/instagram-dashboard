services:
  app:
    build: .
    container_name: instagram-dashboard
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # 폴백용 LLM 키(설정 화면 /settings 에 키가 없을 때만 사용).
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # ── 매일 아침 이메일 리포트 (/api/cron/daily-report) ──
      # 이 값들이 없으면 크론 엔드포인트가 500/502로 실패한다. .env.example 참고.
      - CRON_SECRET=${CRON_SECRET:-}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - REPORT_EMAIL_FROM=${REPORT_EMAIL_FROM:-}
      - REPORT_EMAIL_TO=${REPORT_EMAIL_TO:-}
      - REPORT_URL=${REPORT_URL:-}
    volumes:
      # 컨테이너를 날려도 data 폴더의 데이터(릴스·설정·토큰)는 유지된다.
      - ./data:/app/data
    restart: unless-stopped
